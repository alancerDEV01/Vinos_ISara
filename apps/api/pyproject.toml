[project]
name = "sara-api"
version = "0.1.0"
description = "API de la plataforma de maridaje boliviano"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "redis>=6,<7",
  "structlog>=25,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sara_api"]

[tool.pytest.ini_options]
pythonpath = ["../../backend", "src"]
testpaths = ["../../backend/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
